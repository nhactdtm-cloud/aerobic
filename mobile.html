<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="img_cover/logo.jpg">
<title>Spotify Pro Max</title>

<style>
/* CẤU TRÚC NỀN TẢNG */
body { 
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #FDFBF7; /* THAY ĐỔI: Đổi sang Nền trắng kem vỏ trứng cho dịu mắt */
  color: #212121;  /* THAY ĐỔI: Đổi sang chữ đen chì */
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* THANH ĐẦU TRANG GỌN GÀNG */
.top-header {
  background: #1E4233; /* THAY ĐỔI: Chuyển sang màu xanh rêu đậm sang trọng */
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 1px solid rgba(253, 251, 247, 0.1); /* THAY ĐỔI: Đường viền mỏng mờ */
  color: #FDFBF7; /* THAY ĐỔI: Chữ trên header màu sáng để nổi bật trên nền xanh */
}

.brand-box {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-box {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  object-fit: cover;
}

.brand-box h2 {
  font-size: 15px;
  margin: 0;
  font-weight: bold;
  color: #FDFBF7; /* Đảm bảo tên thương hiệu hiển thị rõ */
}


/* VÙNG CUỘN CHÍNH */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  padding-bottom: 180px; 
}

/* DANH SÁCH ALBUM HÀNG NGANG */
.sidebar {
  width: 100%;
  background: transparent;
  padding: 0;
  margin-bottom: 5px;
}

#albumList {
  display: flex;
  flex-direction: row; 
  gap: 10px;
  overflow-x: auto; 
  overflow-y: hidden;
  white-space: nowrap;
  padding-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}

#albumList::-webkit-scrollbar {
  display: none;
}

/* THỂ ALBUM THEO PHONG CÁCH VIÊN THUỐC DI ĐỘNG */
.album {
  display: inline-flex; 
  align-items: center;
  padding: 10px 18px;
  background: #FFFFFF; /* THAY ĐỔI: Viên thuốc album mặc định màu trắng tinh nổi trên nền kem */
  color: #212121; /* THAY ĐỔI: Chữ đen chì */
  border-radius: 20px; 
  font-size: 13px;
  text-align: center;
  border: 1px solid rgba(30, 66, 51, 0.15); /* THAY ĐỔI: Viền màu xanh rêu nhạt */
  font-weight: bold;
  transition: all 0.2s ease;
  flex-shrink: 0; 
  cursor: pointer;
}

.album:active, .album.active {
  background: #1E4233 !important; /* THAY ĐỔI: Khi chọn, album biến thành màu Xanh rêu đậm */
  color: #FDFBF7 !important;     /* THAY ĐỔI: Chữ chuyển sang màu kem để tương phản */
  border-color: #1E4233 !important;
}

/* HIỆU ỨNG THẢ XUỐNG CHO DANH SÁCH BÀI HÁT */
#songList {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 15px;
  max-height: 0; 
  overflow: hidden; 
  opacity: 0;
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; 
}

#songList.show {
  max-height: 2000px; 
  opacity: 1;
}

.song {
  padding: 14px;
  background: #FFFFFF; /* THAY ĐỔI: Khối bài hát màu trắng tinh sạch sẽ */
  color: #212121; /* THAY ĐỔI: Chữ đen chì */
  border-radius: 8px;
  font-size: 14px;
  border: 1px solid rgba(30, 66, 51, 0.08); /* THAY ĐỔI: Viền xanh rêu siêu mờ */
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: fadeInSong 0.3s ease forwards; 
}

@keyframes fadeInSong {
  from { opacity: 0; transform: translateY(-5px); }
  to { opacity: 1; transform: translateY(0); }
}

.song:active, .song.active {
  background: #C84B31 !important; /* THAY ĐỔI: Khi bài hát được chọn/chạm chuyển sang màu Đỏ gạch */
  color: #FFFFFF !important;     /* THAY ĐỔI: Chữ chuyển hẳn sang trắng */
}

/* PLAYER CỐ ĐỊNH PHÍA DƯỚI */
.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  background: rgba(253, 251, 247, 0.96); /* THAY ĐỔI: Nền Player màu kem mờ tạo hiệu ứng mượt mà */
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 -4px 20px rgba(30, 66, 51, 0.08); /* THAY ĐỔI: Đổ bóng mờ nhẹ màu xanh rêu tránh bị tối đen */
  border-top: 1px solid rgba(30, 66, 51, 0.1); /* THAY ĐỔI: Viền trên màu xanh rêu nhạt mảnh */
  touch-action: none;
}

.cover {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  margin: 0 auto;
  object-fit: cover;
  display: block;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1); /* THÊM: Đổ bóng nhẹ cho đĩa nhạc nổi lên nền sáng */
}

.controls {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.controls button {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: none;
  background: #1E4233; /* THAY ĐỔI: Nút tròn điều khiển nhạc màu Xanh rêu đậm bọc lấy icon */
  color: #FFFFFF; /* THAY ĐỔI: Biểu tượng (Play/Pause) màu trắng bên trong */
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.controls button:active {
  background: #C84B31; /* THAY ĐỔI: Khi bấm giữ nút điều khiển sẽ nháy đỏ gạch phản hồi */
}

.progress {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

#time {
  font-size: 11px;
  color: #555555; /* THAY ĐỔI: Đổi sang xám đậm dễ đọc trên nền sáng */
  min-width: 30px;
}

#seek {
  flex: 1;
  accent-color: #C84B31; /* THAY ĐỔI: Thanh kéo thời gian phát nhạc chạy màu Đỏ gạch cực đẹp */
}

#songTitle {
  width: 100%;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  color: #212121; /* THAY ĐỔI: Tên bài hát phát ở player màu đen chì */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#volume {
  display: none;
}

/* TEMPO BOX (KHU VỰC TỐC ĐỘ) */
#tempoBox {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 0 6px;
}

.tempo {
  flex: 1;
  text-align: center;
  font-size: 12px;
  white-space: nowrap;
  color: #000000; /* THAY ĐỔI: Chữ màu đen chì */
  padding: 4px 0;
}

.tempo.active {
  background: #C84B31; /* THAY ĐỔI: Nút tempo được chọn phủ màu đỏ gạch */
  color: #FFFFFF; /* THAY ĐỔI: Chữ chuyển trắng */
  transform: scale(1.05);
  border-radius: 14px;
}

/* trái + phải */
.tempo.side {
  opacity: 1;
}

/* ERROR POPUP */
#speedError {
  position: fixed;
  top: 30%; 
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10000;
  
  font-size: 12px; 
  padding: 10px 16px; 
  width: auto;
  max-width: 250px; 
  
  /* THAY ĐỔI: Hộp thông báo nền trắng tinh sang trọng, viền xanh mờ */
  background: rgba(255, 255, 255, 0.98); 
  border: 1px solid rgba(30, 66, 51, 0.15);
  color: #212121; /* Chữ thông báo màu đen chì */
  border-radius: 20px;
  box-shadow: 0 4px 16px rgba(30, 66, 51, 0.12);
}

.song-item-title{
    font-size:14px;
    font-weight:500;
    color:#212121 !important;
}

.song-item-artist{
    color:#555555 !important;
}

/* Khi dòng bài hát được active, ép chữ tiêu đề bên trong sang màu trắng */
.song.active .song-item-title {
  color: #FFFFFF !important;
}

.song-item-artist {
  font-size: 12px;
  color: #555555; /* THAY ĐỔI: Tên ca sĩ mặc định màu xám đậm */
  margin-top: 2px;
  line-height: 1.2;
}

/* Khi dòng bài hát được active, ép chữ ca sĩ bên trong sang màu trắng mờ */
.song.active .song-item-artist {
  color: rgba(255, 255, 255, 0.8) !important;
}

#userBtn{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  background:#FDFBF7;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

#userAvatar{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
}

#userName{
  font-size:12px;
  font-weight:bold;
  color:#212121;
}

.user-box{
  position:relative;
}

#userBtn{
  width:40px;
  height:40px;
  padding:0;
  border:none;
  background:none;
  cursor:pointer;
}

#userAvatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.user-menu{
  display:none;
  position:absolute;
  top:48px;
  right:0;
  width:220px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(0,0,0,.15);

}

.user-menu.show{
  display:block;

}

@keyframes menuFade{
  from{

  }
  to{

    transform:translateY(0);
  }
}

.user-name{
  padding:16px;
  font-size:15px;
  font-weight:700;
  color:#222;
  cursor:pointer;
  border-bottom:1px solid #eee;
  background:linear-gradient(135deg,#FFF7F0,#FDFBF7);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-name:hover{
  background:linear-gradient(135deg,#FFE9D6,#FFF7F0);
}

.user-menu button{
  width:100%;
  border:none;
  background:none;
  padding:12px 16px;
  font-size:14px;
  color:#333;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.user-menu button:hover{
  background:#F5F5F5;
  padding-left:22px;
}

.user-menu button:not(:last-child){
  border-bottom:1px solid #f2f2f2;
}

/* ===== AUTH BUTTON MOBILE STYLE ===== */
.auth-group {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
  max-width: 45vw; /* chặn tràn màn hình */
  justify-content: flex-end;
}

.auth-btn {
  font-size: 12px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s ease;
  white-space: nowrap;
}

/* LOGIN - dạng trong suốt (xịn kiểu app) */
#loginBtn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.35);
  color: #fff;
}

#loginBtn:active {
  transform: scale(0.95);
  background: rgba(255,255,255,0.1);
}

/* REGISTER - nổi bật */
#registerBtn {
  background: #1db954;
  border: none;
  color: #000;
  box-shadow: 0 4px 10px rgba(29,185,84,0.25);
}

#registerBtn:active {
  transform: scale(0.95);
  filter: brightness(0.9);
}

#btnLoadPublicPlaylists{
  width:100%;
  padding:12px 18px;
  margin-bottom:14px;

  background:linear-gradient(135deg,#1E4233,#2E5C49);
  color:#FDFBF7;

  border:none;
  border-radius:999px;

  font-size:14px;
  font-weight:700;

  box-shadow:0 6px 18px rgba(30,66,51,.25);
  transition:.25s;
}

#btnLoadPublicPlaylists:hover{
  transform:translateY(-2px);
}

#btnLoadPublicPlaylists:active{
  transform:scale(.97);
}

#btnLoadPublicPlaylists::before{
  content:"🌍 ";
}

#publicPlaylists {
  display: flex;
  flex-direction: row;
  gap: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  padding-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}

#publicPlaylists::-webkit-scrollbar {
  display: none;
}
/* mobile tối ưu */
@media (max-width: 600px) {
  .auth-btn {
    font-size: 11px;
    padding: 6px 10px;
  }
}

</style>
</head>

<body>

<div class="bg" id="bg"></div>

<!-- TOP HEADER -->

  <div class="brand-box">

</div>
</div>
</div>

<!-- MAIN CONTAINER -->
<div class="main">
  <div class="content-scroll">
    
    <!-- SIDEBAR CHỨA DANH SÁCH ALBUM HÀNG NGANG TRƯỢT MƯỢT -->
<div class="sidebar">

  <!-- NÚT MỚI -->
  <button id="btnLoadPublicPlaylists">
  Bộ sưu tập công khai
</button>

  <div id="albumList"></div>

</div>

    <!-- DANH SÁCH BÀI HÁT PHÍA DƯỚI - TỰ ĐỘNG THẢ TRƯỢT XUỐNG KHI CHỌN ALBUM -->

  </div>
</div>

<!-- PLAYER -->
<!-- PLAYER THEO PHONG CÁCH SPOTIFY MOBILE (ĐÃ SỬA LỖI TEMPO) -->
<div class="player" id="fixedPlayer" style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999; background: #121212; padding: 10px 16px 14px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); border-top: 1px solid #282828; touch-action: none;">
  
  <!-- HÀNG CHÍNH: CHỨA COVER, TÊN BÀI HÁT VÀ NÚT PLAY -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;">
    <img id="cover" class="cover" style="width: 42px; height: 42px; border-radius: 4px; object-fit: cover; flex-shrink: 0;">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start;">
  <div id="songTitle" style="text-align: left; font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; width: 100%;">Chưa chọn bài</div>

</div>

    <div class="controls" style="display: flex; align-items: center; flex-shrink: 0;">
      <button id="playBtn" onclick="toggle()" style="width: 36px; height: 36px; border-radius: 50%; border: none; background: #fff; color: #000; font-size: 14px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; padding-left: 2px;">▶</button>

  </div>

         width: 320px;
         max-width: 90vw;
         height: 20px;
         background: #282828;
         border-radius: 16px;
         overflow: visible;
         border: 1px solid #333;">
      
      
      <!-- Lõi cuộn tempo Box -->
      <div id="tempoBox">
  <div class="tempo side" id="t1">120 BPM</div>

<!-- LƯU Ý: Thêm đoạn CSS này vào thẻ <style> trên đầu trang của bạn để ẩn thanh cuộn triệt để -->
<style>
#tempoBox::-webkit-scrollbar, .clean-scroll::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
#tempoBox {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
</style>

<!-- ĐOẠN JAVASCRIPT CẬP NHẬT (Thay thế đoạn xử lý tempo cũ ở cuối file của bạn) -->
<script>
const tBox = document.getElementById('tempoBox');
let tTimeout;


// Thiết lập đưa số 140 (ở giữa) vào đúng vị trí tiêu điểm khi tải trang
function initTempoPosition() {
  const activeT = tBox.querySelector('.tempo.active');
  if (activeT) {
    tBox.scrollTop = activeT.offsetTop;
  }
}
// Chạy khởi tạo sau khi giao diện đã render xong
setTimeout(initTempoPosition, 400);

// Mở khóa sự kiện cuộn riêng cho tempoBox
tBox.addEventListener('wheel', function(e) { e.stopPropagation(); }, { passive: true });
tBox.addEventListener('touchmove', function(e) { e.stopPropagation(); }, { passive: true });

// Lắng nghe sự kiện cuộn
tBox.addEventListener('scroll', function() {
  clearTimeout(tTimeout);
  tTimeout = setTimeout(updateTempoSelection, 100); // Giảm độ trễ xuống 100ms cho nhạy hơn
});

function goProfile(){
  const username = localStorage.getItem("username");

  if(!username){
    window.location.href = "login.html";
    return;
  }

  window.location.href = "profile.html?user=" + encodeURIComponent(username);
}

function toggleUserMenu(){
  document
    .getElementById("userMenu")
    .classList.toggle("show");
}


function updateTempoSelection() {
  // Tính toán điểm trung tâm thực tế dựa trên chiều cao cố định mới (32px)
  const boxCenter = tBox.scrollTop + (tBox.clientHeight / 2);
  let closestElement = null;
  let minDistance = Infinity;
  const allTempos = tBox.querySelectorAll('.tempo');

  allTempos.forEach(t => {
    const elementCenter = t.offsetTop + (t.clientHeight / 2);
    const distance = Math.abs(boxCenter - elementCenter);
    if (distance < minDistance) {
      minDistance = distance;
      closestElement = t;
    }
  });

  if (closestElement && !closestElement.classList.contains('active')) {
    allTempos.forEach(t => {
      t.classList.remove('active');
      t.style.color = '#666';
      t.style.fontSize = '11px';
      t.style.fontWeight = 'bold';
    });
    
    // Kích hoạt giao diện phần tử mới được chọn
    closestElement.classList.add('active');
    closestElement.style.color = '#1db954';
    closestElement.style.fontSize = '13px';
    closestElement.style.fontWeight = '900';
    
    // Gọi lệnh click() để kích hoạt code xử lý tăng/giảm tốc độ trong file music.js
    closestElement.click();
    console.log("TEMPO nhận diện chính xác:", closestElement.innerText);
  }
}

<script>

// ==========================================
async function loadTracksForGuestPlaylist(playlistName, itemUsername) {
  const username = itemUsername || localStorage.getItem("username") || "guest";
  
  try {
    const songListContainer = document.getElementById('songList');
    if (songListContainer) {
      songListContainer.innerHTML = "<div style='color:#888; padding:20px; text-align:center;'>⏳ Đang tải bài hát...</div>";
    }

    // 1. Tải tệp dữ liệu hệ thống gốc (Dạng mảng chứa các nhóm Album)
    const jsonRes = await fetch("data/songs.json");
    const databaseAlbums = await jsonRes.json();

let allSystemSongs = [];

databaseAlbums.forEach(album => {
  if (Array.isArray(album.songs)) {
    allSystemSongs.push(...album.songs);
  }
});

console.log("TOTAL SONGS:", allSystemSongs.length);
console.log("FIRST IDS:", allSystemSongs.slice(0,5).map(x => x.id));

const isArray = Array.isArray(databaseAlbums);

// case 1: root là array
if (isArray) {
  databaseAlbums.forEach(a => {
    if (Array.isArray(a?.songs)) {
      allSystemSongs.push(...a.songs);
    }
    if (Array.isArray(a?.list)) {
      allSystemSongs.push(...a.list);
    }
  });
} 
// case 2: root là object
else if (databaseAlbums?.albums) {
  databaseAlbums.albums.forEach(a => {
    if (Array.isArray(a?.songs)) {
      allSystemSongs.push(...a.songs);
    }
  });
}

    // 3. Gọi fetch lên Google Sheets (GAS) để lấy danh sách ID bài hát của khách
    const res = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "getSongs", 
        username: username,
        playlistName: playlistName,
        incrementClick: true // Tự động cộng 1 vào cột F sheet PLAYLISTS khi click
      })
    });
    
    const rawDataFromGAS = await res.json();
    console.log("USERNAME =", username);
console.log("PLAYLIST =", playlistName);
console.log("RAW GAS =", rawDataFromGAS);
    console.log("🔍 [KIỂM TRA CẤU TRÚC] Dữ liệu thô từ Google Sheets gửi về thực tế là:", rawDataFromGAS);

    let finalSongsList = [];

    // 4. Tiến hành bóc tách ID cột H và đối chiếu với danh sách bài hát hệ thống đã được gộp phẳng
    if (rawDataFromGAS && rawDataFromGAS.length > 0) {
      rawDataFromGAS.forEach((item, index) => {
        let targetId = "";

        if (item !== null && typeof item === "object") {
          if (Array.isArray(item)) {
            // Nếu GAS trả về dạng mảng hàng dữ liệu, bốc ở vị trí cột H (index số 7)
            targetId = item[7] || item[item.length - 1] || "";
          } else {
            targetId = item.id || item.Id || item.ID || item.trackId || "";
          }
        } else {
          targetId = item;
        }

        // Làm sạch chuỗi ID
        targetId = String(targetId).trim();
        console.log(`👉 Dòng số ${index + 1}: Mã ID nhận diện được là [${targetId}]`);

        if (!targetId) return;
        
const matchedSong = allSystemSongs.find(s => {
  return String(s.id).trim() === String(targetId).trim();
});
        
        // 6. Nếu tìm thấy dữ liệu gốc, bốc đầy đủ thuộc tính (bao gồm cả mã ISRC) vào mảng phát nhạc
        if (matchedSong) {
          finalSongsList.push({
            title: matchedSong.title || matchedSong.Title || "Bài hát chưa đặt tên",
            file: matchedSong.file || matchedSong.File || matchedSong.url,      
            cover: matchedSong.cover || matchedSong.Cover || matchedSong.image,
            artist: matchedSong.artist || matchedSong.Artist || "Nghệ sĩ ẩn danh",
            id: matchedSong.id || matchedSong.Id,
            isrc: matchedSong.isrc || matchedSong.Isrc || ""
          });
        }
      });
      
      console.log("📊 Kết quả sau khi quét trùng khớp hoàn toàn:", finalSongsList);
    }

    // Hiển thị thông báo nếu sau khi xử lý mảng vẫn trống rỗng
    if (finalSongsList.length === 0) {

      return;
    }
    
    // Đẩy danh sách bài hát hoàn chỉnh lên giao diện di động

    }
  }
}

async function loadMobileGuestPlaylists() {
  const username = localStorage.getItem("username");
  const albumList = document.getElementById("albumList");
  
  if (!username || !albumList) return;

  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "getPlaylists",
        username: username
      })
    });
    const playlists = await res.json();

    playlists.forEach(item => {
      // Đọc thông minh cấu trúc mảng chuỗi văn bản hoặc mảng đối tượng
      let pName = (item && typeof item === "object") ? (item.playlistName || item.name || "") : item;
      if (!pName) return;

      const divAlbum = document.createElement("div");
      divAlbum.className = "album";
      divAlbum.innerText = "🎵 " + pName;
      divAlbum.setAttribute("data-is-guest", "true");
      divAlbum.setAttribute("data-playlist-name", pName);

      // Kích hoạt luồng chạy khi click vào bộ sưu tập công khai
      divAlbum.onclick = async () => {
        document.querySelectorAll('.album').forEach(alb => alb.classList.remove('active'));
        divAlbum.classList.add('active');
        
        await loadTracksForGuestPlaylist(pName, username);
      };

      albumList.appendChild(divAlbum);
    });

    const divCreateMobile = document.createElement("div");
    divCreateMobile.className = "album";
    divCreateMobile.innerText = "➕ Tạo bộ sưu tập";
    divCreateMobile.style.border = "1px dashed #22c55e"; 
    divCreateMobile.style.color = "#22c55e";

    divCreateMobile.onclick = (e) => {
      e.stopPropagation();
      showMobileAlert("Bạn phải tạo playlist trên web.");
    };

    albumList.appendChild(divCreateMobile);
    
  } catch (err) {
    console.error("Lỗi đồng bộ danh sách playlist từ web:", err);
  }
}

    if (userBtn) userBtn.style.display = "inline-block";

    if (userNameLabel) userNameLabel.textContent = "👋 " + name;

    fetch(GAS_AVATAR + encodeURIComponent(name))
      .then(res => res.json())
      .then(data => {
  const avatar = (data?.avatar || "").trim();

  if (data?.status === "OK" && avatar !== "") {
    userAvatar.src = avatar;
  } else {
    userAvatar.src = "data/avata/avata.png";
  }
})
      .catch(() => {
        if (userAvatar) userAvatar.src = "data/avata/avata.png";
      });

  } else {

    if (loginBtn) loginBtn.style.display = "inline-block";
    if (registerBtn) registerBtn.style.display = "inline-block";
    if (userBtn) userBtn.style.display = "none";

    if (userNameLabel) userNameLabel.textContent = "👋 Người dùng";
  }
}

function toggleUserMenu(){
  const menu = document.getElementById("userMenu");
  if (!menu) return;
  menu.classList.toggle("show");
}


</script>
