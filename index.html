<style>
body {
  margin: 0;
  min-width: 1200px;
  min-width: 1200px;
  font-family: Arial;
  background: #FDFBF7;
  color: #212121;  /* THAY ĐỔI: Đổi từ trắng sang Chữ đen chì dịu mắt */
  display: flex;
  height: 100vh;
  overflow: hidden;
zoom: 0;
}

/* ===== SIDEBAR ===== */
.sidebar {
  flex-shrink:0;
  width: 260px;
  height: 100vh;
  background: #1E4233; /* THAY ĐỔI: Đổi sang Nền xanh rêu đậm sang trọng */
  display: flex;
  flex-direction: column;
  padding: 10px;
  overflow: hidden; /* QUAN TRỌNG */
}

/* LOGO (CỐ ĐỊNH) */
.sidebar-header {
  flex-shrink: 0;
  padding-bottom: 10px;
}

.logo-box {
  width: 140px;
  height: 140px;
  border-radius: 12px;
  object-fit: cover;
  display: block;
  margin: 0 auto;
}

/* DANH SÁCH ALBUM (CHỈ CHỖ NÀY SCROLL) */
#albumFixed {
  flex-shrink: 0;
}

#albumList {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 5px;
}

/* ẩn scrollbar nếu cần */
#albumList::-webkit-scrollbar {
  display: none;
}

/* XÓA HẲN THANH CUỘN TRÊN CHROME, SAFARI, EDGE, CỐC CỐC */
#albumList::-webkit-scrollbar {
  display: none;
}

/* SCROLLBAR */
#albumList::-webkit-scrollbar {
  width: 6px;
}

#albumList::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2); /* THAY ĐỔI: Scrollbar sidebar sáng lên trên nền tối */
  border-radius: 10px;
}

#albumList::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.4);
}



#speedError {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* ALBUM */
.album {
  padding: 10px;
  margin-bottom: 10px;
  background: rgba(255, 255, 255, 0.07); /* THAY ĐỔI: Dùng màu trong suốt trên nền xanh sidebar */
  border-radius: 10px;
  cursor: pointer;
  color: #FFFFFF; /* THAY ĐỔI: Chữ màu trắng để nổi bật trên nền sidebar xanh */
}

.album:hover {
  background: rgba(255, 255, 255, 0.15); /* THAY ĐỔI: Sáng lên khi hover */
}

.album.active {
  background: #C84B31 !important; /* THAY ĐỔI: Album được chọn chuyển sang màu Đỏ gạch cực chất */
  color: #FFFFFF !important;     /* THAY ĐỔI: Chữ chuyển sang trắng để dễ đọc trên nền đỏ gạch */
}

/* MAIN */
.main {
  flex: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}


.content-scroll {
  flex: 1;
  min-width: 0;
}

.tile-box {
  height: 100px;
  background: #FDFBF7; /* THAY ĐỔI: Đồng bộ với màu nền trắng kem */
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 23px;
  flex-shrink: 0;
  color: #212121; /* THAY ĐỔI: Chữ tiêu đề chính màu đen chì */
}

.content-scroll {
  flex: 1;
  max-height: 360px;
  overflow-y: auto;
  overflow-x: hidden;

  /* Ẩn scrollbar (Firefox + IE/Edge cũ) */
  scrollbar-width: none;
  -ms-overflow-style: none;
}

/* Ẩn scrollbar cho Chrome, Edge, Safari */
.content-scroll::-webkit-scrollbar {
  display: none;
}

.content-scroll::-webkit-scrollbar {
  width: 8px;
}

.content-scroll::-webkit-scrollbar-thumb {
  background: #1E4233; /* THAY ĐỔI: Scrollbar chính dùng màu xanh rêu */
  border-radius: 10px;
}

.content-scroll::-webkit-scrollbar-thumb:hover {
  background: #C84B31; /* THAY ĐỔI: Khi hover scrollbar đổi sang màu đỏ gạch của bạn */
}

/* TITLE */
.tile-box h2 {
  margin: 0;
  font-size: 22px;
  font-weight: bold;
}

/* Sắp xếp các thành phần bên trong dòng bài hát theo hàng ngang */
.song {
  display: flex;
  align-items: center;
  gap: 15px; 
  padding: 10px 15px;
  margin-bottom: 8px;
  background: #FFFFFF; /* THAY ĐỔI: Nền bài hát màu trắng tinh để nổi bật trên nền kem */
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid rgba(30, 66, 51, 0.05); /* THÊM: Viền mờ màu xanh rêu giúp khối bài hát sắc nét */
}

/* Định dạng cho số thứ tự bài hát */
.song-index {
  font-size: 14px;
  color: #1E4233; /* THAY ĐỔI: Số thứ tự màu xanh rêu cho đồng bộ */
  width: 20px; 
  text-align: center;
}

.song-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0; /* Thêm dòng này để kích hoạt cắt chữ */
  flex: 1;      /* Thêm dòng này để tên bài hát chiếm hết khoảng trống */
}


.song-item-title {
  font-size: 15px;
  font-weight: bold;
  color: #212121; 

  /* THÊM 3 DÒNG NÀY */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Tên ca sĩ */
.song-item-artist {
  font-size: 12px;
  color: #555555; 

  /* THÊM 3 DÒNG NÀY ĐỂ TÊN CA SĨ CŨNG KHÔNG BỊ TRÀN */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Khi bài hát đang phát (Đang active nền đỏ gạch) */
.song.active {
  background: #C84B31 !important; /* THAY ĐỔI: Dòng bài hát đang phát đổi sang Đỏ gạch nổi bật */
}

.song.active .song-item-title {
  color: #FFFFFF !important; /* THAY ĐỔI: Tên bài hát chuyển sang màu trắng */
}

.song.active .song-index {
  color: #FFFFFF !important; /* THAY ĐỔI: Số thứ tự chuyển sang màu trắng */
}

.song.active .song-item-artist {
  color: rgba(255, 255, 255, 0.8) !important; /* THAY ĐỔI: Tên ca sĩ chuyển sang trắng mờ quyến rũ */
}

.user-box {
  position: relative;
}

.user-menu{
  display: none;
  position: absolute;
  top: 48px;
  right: 0;

  width: 220px;      /* giữ nguyên */
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 12px 35px rgba(0,0,0,.15);
  border: 1px solid #eee;

  z-index: 99999;    /* nổi lên trên tất cả */
}

.user-menu.show{
  display:block;
  animation:menuFade .2s ease;
}

@keyframes menuFade{
  from{
    opacity:0;
    transform:translateY(-8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.user-name{
  padding:16px;
  font-size:15px;
  font-weight:700;
  color:#222;
  cursor:pointer;
  border-bottom:1px solid #eee;
  background:linear-gradient(135deg,#FFF7F0,#FDFBF7);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-name:hover{
  background:linear-gradient(135deg,#FFE9D6,#FFF7F0);
}

.user-menu button{
  width:100%;
  border:none;
  background:none;
  padding:12px 16px;
  font-size:14px;
  color:#333;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.user-menu button:hover{
  background:#F5F5F5;
  padding-left:22px;
}

.user-menu button:not(:last-child){
  border-bottom:1px solid #f2f2f2;
}


/* BACKGROUND */
.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  filter: blur(40px);
  opacity: 0.15; /* THAY ĐỔI: Giảm độ mờ một chút để không làm bẩn nền trắng kem */

}

#infoTitle {

}

.filter-bar {

  background: #FDFBF7; /* THAY ĐỔI: Nền đồng bộ màu kem */
  border-bottom: 1px solid rgba(30, 66, 51, 0.1); /* THAY ĐỔI: Đường viền mỏng mờ */
}

.filter-bar select {
  background: #FFFFFF; /* THAY ĐỔI: Ô chọn màu trắng tinh */
  color: #212121; /* THAY ĐỔI: Chữ trong ô màu đen chì */
  border: 1px solid rgba(30, 66, 51, 0.2); /* THAY ĐỔI: Viền ô chọn */
  padding: 5px 15px;
  border-radius: 10px;

  cursor: pointer;
}

#tempoBox {
  display: flex;
  margin-left: 20px;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

.tempo {
  width: 100%;
  padding: 8px 10px;
  background: rgba(30, 66, 51, 0.05); /* THAY ĐỔI: Nền mờ xanh rêu */
  border-radius: 0px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
  font-size: 14px;
  opacity: 0.5;
  color: #212121; /* THAY ĐỔI: Chữ màu đen chì */
}

.tempo-btn:hover {
  background: rgba(200, 75, 49, 0.15); /* THAY ĐỔI: Hover tạo vệt đỏ gạch mờ */
  transform: scale(1.03);
}

.tempo.active {
  opacity: 1;
  color: #C84B31; /* THAY ĐỔI: Tempo đang active chuyển sang màu đỏ gạch */
  font-size: 16px;
  font-weight: bold;
  transform: scale(1.1);
}

.title-area {
  display: flex;
  flex-direction: column;
  gap: 20px; /* 👈 chỉnh khoảng cách ở đây */
  align-items: flex-start;
}

#userBtn {
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;

  margin-right: 30px; /* ← đẩy sang trái */
}

#userAvatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid transparent;
  transition: 0.2s;
}

#userBtn:hover #userAvatar {
  border: 2px solid #C84B31;
  transform: scale(1.05);
}

/* ← chỉnh khối vuông bên phải */

.content-wrapper{
  display:flex;
  gap:15px;
  align-items:stretch;
}

.right-box h3{
  position:sticky;
  top:0;

  margin:-8px 0 15px;
  padding:10px 0;

  background:#1E4233;

  font-size:16px;
  color:#fff;

  z-index:10;
}

.public-playlist{
  padding:10px;
  margin-bottom:8px;
  background:rgba(255,255,255,.15);
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}

.public-playlist:hover{
  
  background:rgba(0, 0, 0, 0.08);
}

.right-box {
  flex-shrink:0;
  width: 280px;
  height: calc(100vh - 250px);
  background: #1E4233;
  margin-top: 10px;
  margin-right: 20px;
  padding: 0 15px 15px 15px;
  
  /* GIỮ NGUYÊN KHẢ NĂNG CUỘN DỮ LIỆU */
  overflow-y: auto;
  overflow-x: hidden;

  border-radius: 12px;
  box-sizing: border-box;
  color: #fff;

  /* ẨN THANH TRƯỢT TRÊN TRÌNH DUYỆT FIREFOX */
  scrollbar-width: none; 
}

/* ẨN THANH TRƯỢT TRÊN CHROME, SAFARI, EDGE VÀ CỐC CỐC */
.right-box::-webkit-scrollbar {
  display: none;
}

/* Sửa lại class có sẵn của bạn: Thêm thuộc tính flexbox */
.public-playlist {
  display: flex;
  justify-content: space-between;
  align-items: center;
  
  padding: 10px;
  margin-bottom: 8px;
  background: rgba(255,255,255,.15);

  cursor: pointer;
  transition: .2s;
}

/* Định dạng khối chữ bên trong */
.playlist-info {
  display: flex;
  flex-direction: column;
  line-height: 1;
}

/* Định dạng nút ghim */
.pin-btn {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.35); /* Mặc định nút ghim có màu mờ ẩn đi */
  cursor: pointer;
  padding: 6px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
  flex-shrink: 0; /* Không cho nút ghim bị bóp méo */
}

/* Hiệu ứng khi di chuột vào nút ghim */
.pin-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

/* TRẠNG THÁI SAU KHI ĐÃ GHIM */
.public-playlist.pinned {
  background: rgba(255, 255, 255, 0.25); /* Làm hộp nhạc sáng lên */
  border-left: 3px solid #000000; /* Thêm vạch màu vàng bên trái làm điểm nhấn */
}

.public-playlist.pinned .pin-btn {
  color: #ffca28; /* Biến cái ghim thành màu vàng */
  transform: rotate(-45deg); /* Xoay xiên cái ghim nhìn rất chuyên nghiệp */
}



.public-playlist.active{
  background: #C84B31 !important;
  color: #fff !important;
}

/* ===== AUTH BUTTONS ===== */

#registerBtn {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 14px;

  border: 1px solid rgba(30, 66, 51, 0.25);

}

/* Nút Đăng nhập */
#loginBtn {
  background: #1E4233;

}

#loginBtn:hover {

#registerBtn {

#registerBtn:hover {

#loginBtn, #registerBtn {

.song-title-link,

.hidden {

}

}

<script>
  
function checkUserSession() {
  const name = localStorage.getItem("username");

  const loginBtn = document.getElementById("loginBtn");
  const registerBtn = document.getElementById("registerBtn");
  const userBtn = document.getElementById("userBtn");
  const userNameLabel = document.getElementById("userNameLabel");
  const userAvatar = document.getElementById("userAvatar");

  if (name) {
    if (loginBtn) loginBtn.style.display = "none";
    if (registerBtn) registerBtn.style.display = "none";
    if (userBtn) userBtn.style.display = "inline-block";

    if (userNameLabel) userNameLabel.textContent = "👋 " + name;

    // ĐƯỜNG DẪN GỐC (Dùng "." nếu chạy máy local, hoặc đổi thành link GitHub nếu muốn chạy online)
    const BASE_PATH = "."; 
    const USERS_JSON_URL = `${BASE_PATH}/data/users.json`;

    // Gọi file users.json để lấy thông tin ảnh avatar của user đang đăng nhập
    fetch(USERS_JSON_URL)
      .then(res => {
        if (!res.ok) throw new Error("Không thể tải file users.json");
        return res.json();
      })
      .then(data => {
        const users = data.users || [];
        // Tìm đúng thông tin của user đang đăng nhập dựa vào biến 'name' trong localStorage
        const currentUser = users.find(u => u.username === name);

        if (currentUser && currentUser.avatar) {
          // Xóa dấu gạch chéo dư thừa ở đầu đường dẫn ảnh nếu có
          const cleanAvatarPath = currentUser.avatar.replace(/^\/+/, "");
          // Gộp đường dẫn thành: ./data/avata/avatar_admin_1781412213598.png
          userAvatar.src = `${BASE_PATH}/${cleanAvatarPath}`;
        } else {
          // Nếu user không có ảnh hoặc không tìm thấy user, dùng ảnh mặc định
          userAvatar.src = "data/avatar/avata.png";
        }
      })
      .catch(err => {
        console.error("Lỗi lấy avatar từ users.json:", err);
        if (userAvatar) userAvatar.src = "img_cover/logo.jpg";
      });

  } else {
    // Trường hợp chưa đăng nhập thì ẩn nút user và hiện lại nút login/register
    if (loginBtn) loginBtn.style.display = "inline-block";
    if (registerBtn) registerBtn.style.display = "inline-block";
    if (userBtn) userBtn.style.display = "none";

    if (userNameLabel) userNameLabel.textContent = "👋 Người dùng";
  }
}
